name: Scraper

env:
  gitty : ${{ secrets.GITTY }}
on:
  workflow_dispatch:
  schedule:
    # Brisbane has no daylight saving (always UTC+10), so 4am-10pm Brisbane is a fixed UTC
    # window: UTC hours 18-23 and 0-12 (i.e. every hour except 13-17, which is the Brisbane
    # 11pm-3am overnight gap). Triggers on the hour; the job itself adds up to 15 minutes of
    # jitter before scraping, so the scrape doesn't literally land on :00 every time.
    - cron: "0 0-12,18-23 * * *"

concurrency:
  group: scraper-workflow
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45  # up to 15 of these can be pure jitter sleep before any scraping starts
    steps:
      - name: Check out this repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright/
          key: ${{ runner.os }}-browsers-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-browsers-

      - name: Cache NLTK data
        uses: actions/cache@v4
        with:
          path: ~/nltk_data
          key: ${{ runner.os }}-nltk-data
          restore-keys: |
            ${{ runner.os }}-nltk-

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install firefox
          python -m spacy download en_core_web_sm

      - name: Jitter within the first 15 minutes of the hour
        if: github.event_name == 'schedule'
        run: |
          delay=$(( RANDOM % 900 ))
          echo "Sleeping ${delay}s before scraping"
          sleep "${delay}"

      - name: 🍳 Scrape top stories
        run: python3 Scrapers/new_top_stories.py
        
      - name: 🚀 Commit and push if it changed
        run: |
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            timestamp=$(date -u)
            git commit -m "Latest data: ${timestamp}"
            git pull --rebase
            git push
          else
            echo "No changes to commit"
          fi
